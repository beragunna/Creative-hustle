<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Creative Hustle</title>
<meta name="theme-color" content="#F97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creative Hustle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FFF8EC;--card:#fff;--ink:#2A2140;--mute:#5F587A;--line:#F0E6D6;--ok:#12A36B;--bad:#E5484D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132A;--card:#241E3D;--ink:#F4EFFF;--mute:#BDB3D6;--line:#383056}}
:root[data-theme="dark"]{--bg:#17132A;--card:#241E3D;--ink:#F4EFFF;--mute:#BDB3D6;--line:#383056}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#2A2140;font-family:Poppins,system-ui,sans-serif;color:var(--ink)}
.app{--c:#F97316;--c2:#E8417A;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
@media(min-width:480px){.app{height:min(100%,860px);top:50%;transform:translateY(-50%);border-radius:30px;box-shadow:0 24px 70px #0009}}
h1,h2,h3,.disp{font-family:Fredoka,Poppins,sans-serif}
.hd{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:14px 18px 24px;border-radius:0 0 34px 34px;position:relative;overflow:hidden;flex:none;transition:background .3s}
.hd:before,.hd:after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.12}
.hd:before{width:150px;height:150px;right:-40px;top:-50px}.hd:after{width:90px;height:90px;right:60px;bottom:-45px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.lbl{font:600 .72rem Poppins;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.ib{background:#ffffff33;border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.hero{display:flex;align-items:center;gap:14px;margin-top:10px;position:relative;z-index:1}
.hero h1{font-size:1.65rem;line-height:1.15;margin:0}.hero p{margin:6px 0 0;font-size:.82rem;opacity:.95}
.mh{margin-top:12px;position:relative;z-index:1}.mh h1{font-size:1.4rem;line-height:1.2;margin:2px 0 8px}
.pill{display:inline-block;background:#ffffff38;border-radius:99px;padding:4px 12px;font-size:.75rem;font-weight:600}
main{flex:1;overflow-y:auto;padding:18px 16px 24px}
.in>*{animation:up .4s both}.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(n+5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{--a:#F97316;--b:#FFB347;border:0;border-radius:24px;padding:14px;color:#fff;background:linear-gradient(145deg,var(--a),var(--b));text-align:left;min-height:158px;position:relative;overflow:hidden;cursor:pointer;font:inherit;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 18px #0002}
.mc .big{position:absolute;right:8px;top:-8px;font:700 4.4rem Fredoka;opacity:.22;line-height:1}
.mc small{font:600 .68rem Poppins;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
.mc b{display:block;font:600 1rem/1.25 Fredoka;margin-top:4px;position:relative}
.mc .ft{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;font-weight:600}
.foot{text-align:center;color:var(--mute);font-size:.8rem;margin-top:16px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line);border-left:6px solid var(--c)}
.card h3{margin:0 0 6px;font-size:1.02rem}.card p{margin:0;line-height:1.6;font-size:.9rem;color:var(--mute)}
details.note{background:var(--card);border-radius:20px;border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
details.note[open]{border-color:var(--c);box-shadow:0 6px 16px #0000000d}
summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;font:600 .98rem/1.3 Fredoka,Poppins}
summary::-webkit-details-marker{display:none}
.num{flex:none;width:30px;height:30px;border-radius:11px;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;display:grid;place-items:center;font-size:.85rem}
.chev{margin-left:auto;transition:transform .25s;color:var(--mute)}details[open] .chev{transform:rotate(90deg)}
.nb{padding:2px 18px 18px 18px;line-height:1.85;font-size:.96rem;color:var(--ink);opacity:.9;animation:up .3s both}
textarea{width:100%;min-height:120px;border-radius:14px;border:2px dashed var(--c);padding:12px;font:.9rem Poppins,sans-serif;background:var(--bg);color:var(--ink);resize:vertical}
.chip{display:inline-block;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-radius:99px;padding:4px 14px;font-size:.78rem;font-weight:600;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer;transition:background .2s}
.box{flex:none;width:28px;height:28px;border-radius:10px;border:2.5px solid var(--c);display:grid;place-items:center;color:#fff;font-weight:700;transition:background .2s}
.row.on .box{background:var(--c)}.row.on{background:color-mix(in srgb,var(--c) 12%,var(--card))}
.row b{display:block;font:600 .98rem Fredoka,Poppins}.row span{font-size:.86rem;color:var(--mute);line-height:1.5}
.sum{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px}
.sum b{font:600 1.05rem Fredoka}.sum span{display:block;font-size:.82rem;color:var(--mute)}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 .92rem Poppins,sans-serif;cursor:pointer;transition:transform .15s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2));border-radius:99px;transition:width .4s}
.why{font-size:.88rem;line-height:1.55;background:var(--card);border-radius:14px;padding:12px;margin:4px 0 10px;border:1px solid var(--line)}
.btn{display:block;width:100%;border:0;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:14px;border-radius:99px;font:600 1rem Fredoka,Poppins;cursor:pointer;margin-top:6px}
.score{text-align:center;padding:14px 0 18px}.score p{margin:10px 0 0;font-weight:600}
.tl{position:relative;padding-left:26px;margin-bottom:6px}.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:-14px;width:3px;background:var(--line);border-radius:3px}
.tl:last-child:before{display:none}.tl i{position:absolute;left:0;top:6px;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));border:4px solid var(--bg)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 4px 10px;flex:none}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 .66rem Poppins,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button i{width:56px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav button.act{color:var(--ink)}nav button.act i{background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--c)}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #FFC93C;outline-offset:2px}
.tools{display:flex;justify-content:flex-end;margin-bottom:10px}
.tool{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--c);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 .82rem Poppins,sans-serif;cursor:pointer}
.seg{display:flex;background:var(--line);border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:99px;font:600 .85rem Poppins,sans-serif;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px #0002}
.fc{perspective:900px;margin:8px 0 14px}
.fci{position:relative;display:block;width:100%;height:250px;border:0;background:none;padding:0;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fci.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;background:linear-gradient(145deg,var(--c),var(--c2));font:600 1.55rem/1.3 Fredoka,Poppins,sans-serif;box-shadow:0 10px 24px #0002}
.face.back{transform:rotateY(180deg);background:var(--card);color:var(--ink);border:3px solid var(--c);font:500 1.05rem/1.6 Poppins,sans-serif}
.fcr{display:flex;gap:10px}
.fcr button{flex:1;padding:13px 6px;border-radius:99px;border:2px solid var(--c);background:var(--card);color:var(--ink);font:600 .9rem Poppins,sans-serif;cursor:pointer}
.fcr .got{background:var(--c);color:#fff}
.sheet{background:#fff;color:#1b1630;border-radius:20px;padding:20px;line-height:1.75;font-size:.95rem}
.sheet h2{font:700 1.3rem Fredoka,sans-serif;margin:0 0 6px;color:var(--c)}
.sheet h3{font:600 1.1rem Fredoka,sans-serif;margin:18px 0 6px;border-bottom:2px solid var(--c);padding-bottom:4px}
.sheet h4{margin:12px 0 2px;font:600 .98rem Poppins,sans-serif}.sheet p{margin:0 0 6px}
.sheet ul{padding-left:18px;margin:0}.sheet ul.chk{list-style:none;padding:0}
.sheet .tip{color:#6b6380;font-size:.8rem;margin-top:14px}
@media print{html,body{height:auto;background:#fff}:root{padding:0}.hd,nav,.noprint{display:none!important}.app{position:static;transform:none;height:auto;max-width:none;box-shadow:none;border-radius:0;overflow:visible;display:block;background:#fff}main{overflow:visible;padding:0}.sheet{padding:0;border-radius:0}.sheet h4,.sheet h3{break-after:avoid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><header class="hd" id="hd"></header><main id="main"></main><nav id="nav"></nav></div>
<script>
// ===== COURSE CONTENT (edit here) =====
const D=[
{t:"Module 1: Mindset & Ideation",
notes:[["Employee vs entrepreneur mindset","Employees wait for an instruction manual and a salary. Entrepreneurs spot friction, a broken system or daily unhappiness, and build a solution. A failed try is data for the next pivot."],["3 Kenyan business myths","Capital myth: you need millions. Competition myth: the market is crowded. Degree myth: you need a business degree. In reality most big brands began as micro-hustles, competition proves people spend, and customers buy solutions."],["4 Windows and the Hustle Map","Windows: Inefficiency, Aggregation, Convenience, Value Addition. Map your area with Daily Annoyance, Invisible Waste, Premium Upgrade and Cash Resources. Mwangi dried surplus tomatoes into strips for a 400% margin."]],
keys:[["Spot friction","Hidden money sits where people are unhappy or systems are broken."],["Start small","Capital is not the first step."],["Competition","It proves people spend money."],["Reality check","Pitch to 5 strangers and ask for a down-payment."]],
outs:["Name the 3 Kenyan business myths","Use the 4 Windows of Opportunity","Complete my Hustle Map","Run the 5-Person Reality Check"],
quiz:[{q:"Which is NOT one of the 4 Windows of Opportunity?",o:["Inefficiency","Aggregation","Inheritance","Value Addition"],a:2,w:"The windows are Inefficiency, Aggregation, Convenience and Value Addition."},{q:"What did Mwangi turn rotting tomatoes into?",o:["Juice","Sun-dried tomato strips","Tomato sauce","Seedlings"],a:1,w:"Solar-dried, spiced strips earned a 400% margin."},{q:"In the Reality Check, who should you pitch to?",o:["Family","Close friends","Strangers","Teachers"],a:2,w:"Strangers give honest feedback; family and friends are polite."}],
teach:{plan:[["Teach","Mindset shift and myths","Contrast employee and entrepreneur mindsets, then debunk the 3 myths."],["Activity","The Shilling Pivot","10 minutes: groups turn a clothes peg into something someone would pay KES 200 for today."],["Assignment","5-Person Reality Check","Pitch to 5 strangers and record their exact feedback."]],ask:["Where is the friction in your neighbourhood?"]}},
{t:"Module 2: Market Research & Validation",
notes:[["Slay the Polite Lie","Kenyans are polite, so people call your idea nice. Praise is free. Real validation is skin in the game: pre-orders, cash deposits or signed agreements."],["The Mum Test","Talk about their life, not your idea. Ask 'Tell me about the last time you ran out of milk', not 'Would you buy a milk delivery app?'"],["Measuring fit","Sean Ellis test: ask how disappointed they would be if the product vanished. If 40% say extremely disappointed, you have product-market fit. A Till Number request beats any emoji."]],
keys:[["Problem first","Fall in love with the problem, not the product."],["Skin in the game","Deposits prove demand."],["40% rule","At least 40% extremely disappointed."],["Truth metric","A request for your M-Pesa Till Number."]],
outs:["Spot a Polite Lie","Ask Mum Test questions","Apply the 40% rule","Run a WhatsApp smoke test"],
quiz:[{q:"Which is the best interview question?",o:["Would you buy my app?","Is KES 150 fair?","Tell me about the last time you ran out of milk.","Do you like my idea?"],a:2,w:"Good questions explore real past habits, not opinions about your idea."},{q:"What score shows product-market fit?",o:["10%","25%","40%","90%"],a:2,w:"At least 40% extremely disappointed means fit."},{q:"The ultimate truth metric is…",o:["WhatsApp likes","Fire emojis","A Till Number request","Compliments"],a:2,w:"Likes are vanity; a Till request means someone will pay."}],
teach:{plan:[["Teach","Polite Lie and Mum Test","Role-play good and bad interview questions."],["Activity","Smoke Test flyer","Write a WhatsApp flyer: problem solved, timeframe, location, discount for first 10, reply YES."],["Assignment","Post in 3 groups","Track Till requests, not emojis."]],ask:["Why did people say no: price, trust or convenience?"]}},
{t:"Module 3: Real-World Hustles",
notes:[["The Dalali (broker) tax","Every hand that touches a product takes a cut. A bag leaves the farmer at KES 1,500 and reaches the urban retailer at KES 3,500 after three brokers."],["Potato pitfall vs crisp pivot","Mwangi sold raw potatoes roadside and lost KES 1,500 to competition and 20% rot. Wanjiku peeled and sliced them into ready-to-fry bags sold on WhatsApp, earning a 66.6% net margin."],["6 counterconventional mindsets","Yes We Can, Problem-first, Think Narrow, Ask for Cash, Borrow Don't Steal, Don't Ask Permission (John Mullins). Urban Greens sells time, not vegetables."]],
keys:[["Raw commodity trap","Selling raw goods means thin margins."],["Change position","Take on the customer's labour."],["Ask for cash","Tesla pre-sold 100 Roadsters."],["Cash leak audit","Record every transaction, including M-Pesa fees."]],
outs:["Map a broker value chain","Explain the Raw Commodity Trap","Name the 6 mindsets","Start a 7-day Cash Leak Audit"],
quiz:[{q:"Why did Wanjiku earn more than Mwangi?",o:["Cheaper potatoes","She added value by peeling and slicing","She sold at night","Luck"],a:1,w:"She took over the customer's labour and sold a ready product."},{q:"'Ask for Cash' means…",o:["Borrow from banks","Use customer deposits to fund production","Beg for donations","Sell on credit"],a:1,w:"Deposits fund production, reducing the capital you need."},{q:"Urban Greens is really selling…",o:["Vegetables","Time","Bags","Recipes"],a:1,w:"Busy working mothers pay to save time."}],
teach:{plan:[["Teach","Value chains","Draw the broker price jump from KES 1,500 to 3,500."],["Activity","Case study debate","Compare Mwangi's and Wanjiku's potato hustles."],["Assignment","7-Day Cash Leak Audit","Bring raw line-by-line data, not estimates."]],ask:["Which broker could you cut out of your product's chain?"]}},
{t:"Module 4: Financial Discipline",
notes:[["Holey bucket: cash leaks","Sales are water; leaks are holes. James spends KES 380 a day on transport, airtime and tea, which is KES 11,400 a month. Leak % = leaks ÷ income × 100, so 6,500 ÷ 15,000 = 43.3%."],["Golden Rule and the cow","Never mix personal M-Pesa with your business Till. Working capital is the cow's food. Pay yourself a salary and ride the float with customer deposits."],["The Daftari ledgers","Sales ledger, petty cash log, Deni book (wanaokudai and unaodai) and stock ledger. Every shilling must leave a footprint. Keep records 7 years for KRA and use eTIMS."]],
keys:[["Fund isolation","Separate Till, SIM and bank account."],["No Lambo","Reinvest before buying luxuries."],["Footprint","Never rely on memory."],["Stock variance","Expected minus physical shows theft or error."]],
outs:["Calculate a leak percentage","Separate business and personal money","Keep the 4 ledgers","State the 7-year record rule"],
quiz:[{q:"Weekly income KES 15,000, leaks KES 6,500. Leak percentage?",o:["33.3%","43.3%","53.3%","6.5%"],a:1,w:"6,500 ÷ 15,000 × 100 = 43.3%."},{q:"Which is NOT a Daftari ledger?",o:["Sales ledger","Petty cash log","Deni book","Fashion ledger"],a:3,w:"The four are Sales, Petty Cash, Deni and Stock."},{q:"How long must KRA records be kept?",o:["1 year","3 years","7 years","Forever"],a:2,w:"KRA requires at least 7 years."}],
teach:{plan:[["Teach","Leaks and isolation","Use the Holey Bucket, James and Mary examples."],["Activity","Reconciliation exercise","KES 8,000 sales: remove personal soda and lunch to get net business cash of KES 2,300."],["Assignment","Isolation Sprint","Open a Till, keep 4 ledgers for 7 days, write a one-page reflection."]],ask:["If nearly half your money disappears, how long until stock runs out?"]}},
{t:"Module 5: Costing & Pricing",
notes:[["Carpenter's Math","Annual overheads of KES 14,000 ÷ 48 weeks = KES 291 a week. Over 24 working hours that is KES 12 overhead per hour, which must be in every product's cost."],["Break-even point","Break-even = Fixed costs ÷ (Average price − Variable costs). It is your 'death number': the units you must sell just to survive."],["6 pricing strategies","Cost-plus, psychological (599 not 600), market-skim, going-rate, discriminatory and promotional. Fewer defects lower costs, and exceeding expectations is the cheapest marketing."]],
keys:[["Know overheads","Rent, licences, power and water."],["Break-even","Fixed ÷ (price − variable)."],["Psychological","Price at 599/-, not 600/-."],["Quality","Fewer defects mean lower costs."]],
outs:["Calculate hourly overhead","Compute a break-even point","Choose a pricing strategy","Explain quality as marketing"],
quiz:[{q:"KES 14,000 ÷ 48 weeks is about…",o:["KES 100","KES 291","KES 500","KES 14"],a:1,w:"That is the weekly overhead of about KES 291."},{q:"Break-even formula?",o:["Price × units","Fixed ÷ (price − variable)","Profit ÷ costs","Sales − tax"],a:1,w:"It shows the units needed to cover fixed costs."},{q:"Pricing at 599/- instead of 600/- is…",o:["Cost-plus","Going-rate","Psychological","Promotional"],a:2,w:"It uses perception to influence the buyer."}],
teach:{plan:[["Teach","Costing and overhead","Walk through the Carpenter's Math step by step."],["Activity","Break-even drill","Groups price one product using two strategies."],["Assignment","Cost your product","Include hourly overhead in every price."]],ask:["Which pricing strategy fits your customers best?"]}},
{t:"Module 6: Marketing & Customer Care",
notes:[["Social selling","Treat WhatsApp Status, TikTok and Instagram as storefronts. Learn CapCut for video and Canva for graphics, plus basic SEO and sales copywriting."],["Quality indicators","Your public image rests on Credibility, Reliability and Responsiveness."],["3-step complaint protocol","1. Apologize sincerely, with no ifs or buts. 2. Ask for the facts. 3. Promise only what you can deliver, then fix it personally."]],
keys:[["Stop scrolling","Start selling."],["Tools","CapCut and Canva."],["3 indicators","Credibility, Reliability, Responsiveness."],["Complaints","Turn a failed delivery into loyalty."]],
outs:["Plan content for 3 channels","Name the 3 quality indicators","Apply the complaint protocol","Make a simple promo with Canva or CapCut"],
quiz:[{q:"First step when handling a complaint?",o:["Explain why it's not your fault","Apologize sincerely","Offer a discount","Ignore it"],a:1,w:"Apologize with no ifs or buts, then ask for facts."},{q:"Which tool is for video editing?",o:["Canva","CapCut","Excel","eTIMS"],a:1,w:"CapCut edits video; Canva makes graphics."},{q:"Which is NOT a quality indicator?",o:["Credibility","Reliability","Responsiveness","Popularity"],a:3,w:"The three are Credibility, Reliability and Responsiveness."}],
teach:{plan:[["Teach","Social selling","Show a short product video and discuss what makes it sell."],["Activity","Complaint role-play","Pairs practise the 3-step protocol."],["Assignment","Post for 7 days","Share one product post daily and note responses."]],ask:["Which channel do your customers actually use?"]}},
{t:"Module 7: Legal, Tax & Ethics",
notes:[["Business structures","A sole proprietorship is simplest but you are personally liable. A partnership shares risk. A limited company is a separate legal entity, needed to scale and sign formal contracts."],["KRA checklist","TOT is 3% for turnover under KES 25M, payable even without profit. VAT is 16% above KES 5M turnover. PAYE is remitted by the 9th of every month."],["Ethics and human capital","Health is wealth. HIV/AIDS affects workforce productivity, so a true entrepreneur builds a healthy, supportive workplace."]],
keys:[["Liability","Sole traders are personally liable."],["TOT","3% of turnover, even with no profit."],["VAT","Register above KES 5M turnover."],["PAYE","Remit by the 9th each month."]],
outs:["Compare 3 business structures","State the TOT, VAT and PAYE rules","Explain why compliance protects me","Link ethics to productivity"],
quiz:[{q:"TOT is charged at…",o:["1%","3%","16%","25%"],a:1,w:"Turnover Tax is 3% for turnover under KES 25M."},{q:"VAT registration is required above turnover of…",o:["KES 500,000","KES 1M","KES 5M","KES 25M"],a:2,w:"VAT of 16% applies above KES 5 million."},{q:"PAYE must be remitted by the…",o:["1st","9th","15th","30th"],a:1,w:"The deadline is the 9th of every month."}],
teach:{plan:[["Teach","Structures and KRA","Compare the three structures and the tax checklist."],["Activity","Choose a structure","Groups pick one for a sample business and defend it."],["Assignment","Compliance checklist","List the taxes your business must pay."]],ask:["What could go wrong if you ignore compliance?"]}},
{t:"Module 8: Pitching, Funding & Scaling",
notes:[["Funding your growth","Retained earnings are the safest source. Also use trade credit and government funds such as Uwezo, Women Enterprise Fund and NYOTA (youth 18–29, not beyond Form 4, apply via *254#)."],["The 5 C's of credit","Banks look at Capacity, Capital, Collateral, Conditions and Character."],["Scale with hubs","iHub for tech, Nailab for ed-tech and health, KCIC for agribusiness and clean-tech, LakeHub for Western Kenya. The capstone is the Grand Hustle Pitch."]],
keys:[["Retained earnings","Reinvesting profit is safest."],["Trade credit","Hold supplier stock, pay later."],["5 C's","Capacity, Capital, Collateral, Conditions, Character."],["Grand Pitch","Present a validated, costed plan."]],
outs:["Name 3 funding sources","Recite the 5 C's","Pick a hub to approach","Deliver my Grand Hustle Pitch"],

const X=[
[["Why the 'soma kwa bidii' mindset traps us","Our education system trains us to follow instructions: study hard, pass exams, wait for a good job. When jobs are scarce the brain panics because it was never trained to see opportunity. The entrepreneur looks at the same town and sees friction: slow services, wasted materials, frustrated customers. Practise this daily by writing down three complaints you hear from people around you. Each complaint is a possible business, and the habit of noticing is the first skill you build."],["The three myths in depth","The Capital Myth says you need millions, yet high capital often masks poor planning and leads to overspending before you know what customers want. The Competition Myth says the market is crowded, yet competition is proof that people spend money; you only need to fix one frustration better than lazy incumbents. The Degree Myth says you need a business degree, yet customers buy solutions to their pain, and empathy for the customer beats a certificate every day."],["How to use the Hustle Map","Divide a page into four boxes. Daily Annoyance: what people complain about, such as water that tastes of chlorine. Invisible Waste: what is thrown away, such as sawdust outside carpentry shops. Premium Upgrade: what people travel far to buy because local options are poor quality. Cash Resources: what you own for zero shillings, such as a smartphone, three free hours or a supplier relationship. The best ideas sit where two boxes meet, for example turning a waste item into an upgrade."],["Doing the 5-Person Reality Check well","Pitch your mapped idea to five strangers, not friends or family, who will be polite. Use the script: if I brought this service to your door next Saturday for this price, would you give me a down-payment right now? Write down their exact words. If they will not pay, treat the yes as a polite lie and ask why: was it price, trust or convenience? These answers decide how you adjust the idea in Module 2."]],
[["Fall in love with the problem, not the product","If you build a business around a product, you fail when trends change. If you build it around a problem, you can always pivot and keep serving the same customer. Use your notes from the 5-Person Reality Check to find out why people said no. Group the reasons into price, trust and convenience. Then adjust the original concept to remove those specific friction points, instead of defending your first idea."],["Running a Mum Test interview","Stop pitching and start listening. If you describe your idea, people will lie to be kind. Talk about their life instead. Ask about the last time the problem happened and what they did. Ask how much they paid and why they chose that place. Avoid leading questions such as would you buy an app that delivers milk? Record the answers and look for patterns across several interviews, because one story is an opinion but five similar stories are evidence."],["Vanity versus validation","In the Kenyan market, comments like 'Kazi safi!' and thumbs-up or fire emojis are vanity metrics. They cost the sender nothing. Validation is a pre-order, a cash deposit, a signed agreement or a request for your M-Pesa Till Number. For the Smoke Test MVP, make a WhatsApp flyer that names the service, the problem solved, the timeframe and location, offers a discount to the first 10 sign-ups, and asks people to reply YES. Post it in three groups and count Till requests, not emojis."]],
[["Reading the broker chain","In Kenya every hand that touches a product takes a cut. A bag leaves the rural farmer at KES 1,500. A local broker takes KES 300, a transport broker KES 400 and a wholesale broker KES 500, and the urban micro-retailer finally pays KES 3,500. If you do not map these hands they quietly eat your profit. For your own product, draw the chain and ask which step you can do yourself, shorten or replace."],["Changing your position in the value chain","Mwangi bought raw potatoes and sold them by the roadside. Heavy competition and 20% rot caused a loss of KES 1,500. This is the Raw Commodity Trap. Wanjiku bought the same potatoes but peeled, sliced and blanched them and sold ready-to-fry bags on WhatsApp. By taking on the customer's labour, which is a structural friction, she earned a 66.6% net profit margin. The lesson: customers pay extra to avoid hard work."],["The six mindsets in practice","Yes We Can: accept a request beyond your skill and figure out delivery. Problem-first: solve distress, not product features. Think Narrow: Nike began with elite distance runners. Ask for Cash: Tesla sold 100 Roadsters before building one, so you can take deposits before buying stock. Borrow, Don't Steal: Go Ape borrowed trees from the Forestry Commission. Don't Ask Permission: when rules are unclear, like early Uber, get started and adapt."]],
[["Two kinds of cash leaks","Imagine filling a bucket that has holes. Operational friction is the small daily spending that seems harmless. James spends KES 200 on boda boda, KES 100 on airtime and KES 80 on tea, which is KES 380 a day and KES 11,400 a month. Lifestyle drain is personal spending paid from the till. Mary earns KES 2,000 profit daily but takes out KES 500 lunch, KES 300 transport and KES 800 hair, leaving KES 400. She thinks the business fails, but she spent the profit."],["Fund isolation and riding the float","Never mix personal money with business money. Use a dedicated business Till or Paybill, a separate SIM for business and, where possible, a business bank account. Pay yourself a fixed salary. Ride the float by taking deposits: if you sell kienyeji chickens for Saturday lunch, collect a Till deposit on Tuesday and use it to buy the birds. Follow the No Lambo workflow: profit, reinvest, grow capacity, earn more, and only reward yourself when the business is stable."],["Keeping the four ledgers","The Daily Sales Ledger records every income entry. The Petty Cash Log catches small leaks: airtime KES 100, tea KES 80 and an M-Pesa fee KES 35 total KES 215 a day, or KES 6,450 a month. The Deni Book lists wanaokudai (whom you owe) and unaodai (who owes you), so a claim like 'I already paid' is settled by the record. The Stock Ledger compares expected and physical stock: 100 bags less 40 sold should leave 60, but 52 found means 8 missing. Use eTIMS invoices and keep records for 7 years."]],
[["Why overhead hides your profit","Overheads are the costs of existing: rent, licences, electricity and water. In the Carpenter's example they total KES 14,000 a year: rent KES 3,000, licences KES 500, electricity KES 800, water KES 600 and others. Dividing by 48 weeks gives KES 291 a week, and spread over 24 working hours that is KES 12 per hour. If you leave this KES 12 out of every product's cost, you lose money each time you work, even when sales look good."],["Break-even: your death number","Break-even point = Fixed costs ÷ (Average price − Variable costs). It tells you how many units you must sell just to stay alive. Example: if fixed costs are KES 6,000, you sell at KES 200 and variable cost per unit is KES 80, each unit contributes KES 120 and you need 50 units to break even. Every unit after that is profit. Know this number before you set targets or promise investors anything."],["Choosing a pricing strategy","Cost-plus adds a standard mark-up to total production cost. Psychological pricing uses perception, such as 599/- instead of 600/-. Market-skim sets high initial prices for premium segments. Going-rate copies what competitors charge. Discriminatory pricing changes by customer type, location or time. Promotional pricing goes below cost temporarily to enter a market or clear stock. Whatever you choose, quality matters: fewer defects lower your costs, and surpassing expectations is the cheapest marketing you will ever buy."]],
[["Selling on social media","WhatsApp, TikTok and Instagram are your primary storefronts. Post on WhatsApp Status regularly, share short videos that show the product being used, and write copy that tells people exactly what to do, such as reply YES to book. Basic SEO helps people find you through search. Learn CapCut to edit video and Canva to design flyers, so your marketing looks professional without paying an agency."],["Building credibility, reliability and responsiveness","Credibility means people trust you to do what you say. Reliability means your quality and timing are consistent, so customers never have to wonder. Responsiveness means you answer messages and questions quickly. Together they form your public image. A small business that replies fast, delivers on time and keeps its promises can beat a larger competitor that is slow and careless."],["Handling a complaint step by step","Imagine a failed delivery. First, apologize sincerely, with no ifs or buts, because excuses make the customer angrier. Second, ask for the facts to understand exactly where the system broke. Third, make only promises you can personally deliver, then fix the problem yourself. A customer whose problem is solved well often becomes more loyal than one who never had a problem, so treat every complaint as a chance to earn trust."]],
[["Choosing a business structure","A sole proprietorship is the simplest to start, but you are personally liable for the business debts. A partnership shares risk and resources, so agree the terms in writing. A limited company is a separate legal entity and is needed for scaling and formal contracts. Moving towards a formal structure makes your business investor ready and eligible for larger opportunities."],["Understanding your taxes","Turnover Tax (TOT) is 3% for businesses with annual turnover below KES 25 million, and it is payable even if you have made no profit, so record your sales carefully. VAT of 16% becomes mandatory when annual turnover exceeds KES 5 million. PAYE, the tax deducted from employees, must be remitted by the 9th of every month. Use eTIMS to issue recognised invoices and keep all records for at least 7 years as protection against penalties."],["Ethics and a healthy team","Business ethics means treating customers, staff and the community honestly. Human capital matters: health is wealth, and illnesses such as HIV/AIDS reduce workforce productivity. A creative hustler promotes healthy habits and a supportive environment so the team can work consistently. Honest dealing and care for people build the trust that lets a business grow."]],
[["The funding ladder","Start with retained earnings, which means reinvesting your own profit; it is the safest way to grow. Next use trade credit by negotiating with suppliers to hold their stock and pay later. Then look at government funds such as the Uwezo Fund and the Women Enterprise Fund. The NYOTA Project is for youth aged 18 to 29, up to 35 for persons with disabilities, who have not gone beyond Form 4; apply with USSD code *254#. Your Module 4 records help you qualify."],["The 5 C's in practice","Capacity is your ability to repay, shown by sales records. Capital is how much of your own money is in the business. Collateral is the assets you can pledge. Conditions are how the local economy and the friction you solve justify the loan. Character is your reputation for discipline and honesty. Prepare a short answer to each C before you meet a lender or judge."],["Hubs and the Grand Hustle Pitch","Match your business to a hub: iHub (tech; alumni BRCK, Ushahidi), Nailab (ed-tech and health; Eneza Education), KCIC (agribusiness and clean-tech; M-KOPA Solar), LakeHub in Kisumu (Western Kenya), Savannah Fund (Sendy, Twiga Foods) and Villgro Kenya (healthcare). Read the Q1 2026 Startup Survival Report before applying. In the capstone Grand Hustle Pitch you present your validated, costed and researched plan to the cohort and guest judges."]]];

[["Bounce back: failure as a teacher","David's tomato farm in Kirinyaga was hit by floods, and prices crashed when everyone harvested at once. He did not quit. He asked what happened and why, learned greenhouse farming, improved drainage and staggered his planting, and next season his profits grew. Use the five steps: identify the problem, gather facts, brainstorm solutions, choose the most practical one, then act and review. Challenges are normal in every business; they only become failure when you refuse to learn from them."]],
[["Let customers taste before you launch","A Nakuru entrepreneur let local people sample her juice and give feedback before she opened. Because of what they said, she added new flavours and mobile payment, and she won loyal customers from day one. This is validation in action: instead of guessing, she asked real people, changed the product and only then launched. Combine this with the Till Number test, so feedback is backed by real willingness to pay."]],
[["Waste and problems that became businesses","In Nakuru, Brian saw plastic clogging drains as an opportunity. He collected it with youth groups and made fence posts and paving blocks, creating jobs and profit. Nzambi Matee of Gjenge Makers also turns plastic waste into durable construction products. A Uasin Gishu dairy farmer built a biogas system from cow manure, saving fuel money and producing fertiliser. Ask yourself what your community throws away or complains about, because that is your next window of opportunity."]],
[["Financial honesty and regular reviews","Never alter records, hide income or create false receipts. Honest reporting builds trust with customers, lenders, investors and the government. Review your books regularly by asking: have sales increased, which products perform best, are expenses under control, is cash flow healthy and are my records complete? Simple stock records helped a Kakamega grocer stop buying items he already had, cut waste and raise profit. Digital tools improve accuracy, but they do not replace honesty."]],
[["Pricing for costs, quality and customers","Count both fixed and variable costs. Fixed costs stay the same however much you sell: rent, licences, electricity and water. Variable costs rise with each unit: ingredients, packaging and transport. Add a fair value for your own labour and time. Then check that your price covers all of them with a margin left over. Compare with the going rate, but never copy a competitor's price without knowing your own costs, because their costs may be lower than yours."],["Price transparency and consumer rights","Customers have the right to accurate information, so display correct prices, expiry dates and instructions. Mrs Achieng won trust by checking her scales, showing prices clearly and replacing defective goods, while Mr Kamau's 850g bag sold as 1kg destroyed his shop. Misleading advertising or hidden charges may bring short-term sales but long-term loss. Honest pricing is a legal duty and also a marketing strategy."],["Negotiating prices and written terms","Prepare before you negotiate: know your goal, your walk-away point and what is negotiable. Then listen, state your position, explore solutions, agree and record the deal in writing. A Nakuru vegetable farmer and a hotel stopped quarrelling once they wrote a simple supply agreement covering products, delivery schedule, prices, payment deadlines and quality standards. Negotiation is about a fair outcome for both sides, not defeating the other person."],["Records that prove your pricing works","You cannot know whether your price is right without records. Keep sales records, expense records, receipts, invoices, bank statements and inventory records. Poultry farmer Daniel had no records, so the bank declined his loan, while Esther's organised books won hers. Check weekly that all sales and expenses are entered, receipts are stored, stock is accurate and records are backed up. Good records turn pricing from guesswork into evidence."]],
[["Digital ethics and online reviews","Ethics applies online as well as offline. Protect customer information, respect privacy, avoid misleading online adverts and use original photos and content instead of copying others. Reviews influence buying decisions, so thank customers for praise, answer negative feedback politely and never argue on social media. Naomi, a Mombasa student, used AI design tools to finish posters faster and serve clients in other counties. Check anything AI produces before you post it, because your credibility is on the line."]],
[["Ethics versus the law","The law is the minimum everyone must follow; ethics means doing what is right even when no law requires it. A business can be legal but still unethical, such as an advertisement that exaggerates the benefits of a product. Naomi, a hardware owner in Kitale, refused cheap uncertified cables because they could start a fire, and later a contractor bought everything from her. An Eldoret mechanic told a customer a repair cost KSh 3,000 when another garage quoted KSh 18,000, and his workshop became very busy. Trust is the real profit."],["The 6-step ethical decision model","When a choice is hard, ask: 1. What is the problem? 2. Who will be affected? 3. What options do I have? 4. Which option is most honest and fair? 5. Would I be comfortable if this appeared on the front page of a newspaper? 6. Take responsibility for the decision. Add a quick checklist: is it honest, fair, legal, will it build trust, and will I be proud of it years from now? Use it for dilemmas like a supplier's gift in exchange for special treatment or a customer asking for a false receipt."],["Registering your business step by step","Create an eCitizen account, search and reserve a business name, complete registration, receive your Business Registration Certificate and apply to your county for permits. Also get a KRA PIN, and depending on your business a food handling or health permit and a NEMA approval. Two tailors show the stakes: the unregistered one could not show a certificate and lost a KES 300,000 school uniform order, and another unlicensed trader was shut down until she paid penalties. Registration is an investment, and licences must be renewed."],["Contracts, consumer rights and employment","A valid contract has parties, an offer, acceptance, consideration, terms and signatures. Njoki, a caterer, lost KES 35,000 of ingredients when a client cancelled a KES 80,000 wedding that had only been agreed verbally. Consumers have six rights: safety, information, choice, to be heard, fair treatment and redress. Employees must get fair wages, safe conditions, reasonable hours (up to 8 hours a day and 6 days a week), at least 21 days of annual leave and freedom from discrimination, plus a written contract."],["Protecting ideas and brands","Intellectual property includes trademarks, copyright, patents, industrial designs and trade secrets. Trademarks protect names, logos and slogans, are registered with KIPI and renew every 10 years. Copyright is automatic. Patents protect new inventions for 20 years. Grace lost customers to a copycat called Coco Casa Bites because she had not trademarked CocoCasa Crunch. Keep recipes secret with non-disclosure agreements, and never copy other people's logos, software or music. Richard Turere's Lion Lights show how valuable one original idea can be."],["Sustainability, CSR and governance","A lasting business looks after three things: profit, people and planet. Joseph, a tree nursery owner in Kericho, planted more than he sold and his nursery became one of the best in his region. CSR means acting responsibly and giving back: economic, legal, ethical and philanthropic responsibility. Avoid window dressing, where charity is only publicity. Good governance means clear roles, honest records, written procedures and no conflicts of interest, such as giving a contract to a relative without fair evaluation. The Otieno furniture family regained control once they set clear roles and approvals."]],
[["From vision to action plan","A vision is the big dream, a goal breaks it down and actions are the steps. Make goals SMART. Instead of increasing sales, aim to grow monthly sales from 200 to 300 units in six months through online marketing. A good action plan lists the goal, activities, resources, timeline, person responsible and how you will monitor progress. Faith, a baker in Kericho, spent three months planning equipment, costs, customers and marketing before launching, and avoided costly mistakes. Do the high-priority tasks first, like registration, finance and suppliers."],["Writing a business plan that works","A business plan is your roadmap and convinces lenders and investors. Include a cover page, executive summary, business description, market analysis, marketing plan, operations plan, management, financial plan with break-even point, risk analysis and appendices. Write the executive summary last, answering what problem you solve, why the solution is valuable, why customers will choose it and why the business will succeed. Avoid unrealistic numbers, weak market research, spelling mistakes and ignoring competitors. Kevin's solar irrigation idea only won funding after he wrote a proper plan."],["Pitching with confidence","An elevator pitch lasts 30 to 60 seconds, a short pitch 3 to 5 minutes and a full presentation 10 to 20 minutes. Structure it: a strong opening, the problem, your solution, target market, business model, competitive advantage, financial highlights, your team and a call to action. Use simple visuals, not slides packed with text. If you do not know an answer, say so and explain how you will find out. Amina from Garissa won funding by explaining the real problem, showing her model and giving honest numbers."],["Capital and responsible borrowing","Capital comes from personal savings, family and friends, bank loans, SACCOs, government programmes, investors or crowdfunding, and every source has a trade-off. Borrow only what you need, understand the loan terms and watch cash flow. John of Kakamega reinvested profits first, took a small loan only after checking he could repay it and grew a kiosk into a supermarket employing over 30 people. Growth moves through start-up, growth, expansion and maturity; growing too fast causes cash shortages and falling quality."],["Launch day and customers for life","Before launch, confirm licences and permits, product quality, tested equipment, trained staff, payment systems and marketing. Attract first customers with opening promotions, free samples, referrals and social media. Grace gave free tea to her first 20 customers, and warm service made her Kisii café popular. After launch, watch sales, feedback, stock, cash flow and quality. Keep customers by remembering them: Peter, a barber in Embu, greeted people by name and grew without big adverts. Handle complaints by listening, apologising, investigating, fixing and following up."],["Scaling, resilience and AI","Scaling grows sales without costs rising as fast, while expansion grows physical size and needs investment. You are ready when sales rise consistently, cash flow is healthy and customers are satisfied. Anne in Machakos studied demand and trained staff before opening a second branch. Protect the business with emergency savings, backup suppliers and diversified customers. Use AI to write marketing content, analyse feedback and manage stock, but verify the results, protect customer privacy and keep ethics in your decisions."]]];

[{q:"Which tax is payable even without profit?",o:["PAYE","TOT","VAT refund","Stamp duty"],a:1,w:"TOT is 3% of turnover, so record your sales."},{q:"Which business structure is a separate legal entity?",o:["Sole proprietorship","Partnership","Limited company","Hawker"],a:2,w:"Its owners are not personally liable in the same way."},{q:"What are the normal maximum working hours in the course notes?",o:["6 hours a day","8 hours a day and 6 days a week","12 hours a day","No limit"],a:1,w:"Fair hours are a legal requirement, not a favour."},{q:"Where do you register a trademark in Kenya?",o:["KRA","KIPI","NEMA","KEBS"],a:1,w:"The Kenya Industrial Property Institute handles it."},{q:"Which is NOT one of the four types of CSR responsibility?",o:["Economic","Legal","Philanthropic","Political"],a:3,w:"The four are economic, legal, ethical and philanthropic."}],
[{q:"How many sections are in the business plan outline?",o:["5","8","10","15"],a:2,w:"From cover page to appendices there are 10."},{q:"What is the last step of the pitch structure?",o:["Your team","Call to action","Financial highlights","Opening story"],a:1,w:"Say exactly what you want from the listener."},{q:"Which funding source means sharing ownership?",o:["SACCO","Investors","Personal savings","Trade credit"],a:1,w:"Investors bring big capital but share ownership and decisions."},{q:"Which is NOT a stage of business growth?",o:["Start-up","Expansion","Maturity","Retirement"],a:3,w:"The stages are start-up, growth, expansion and maturity."},{q:"NYOTA applicants apply using which USSD code?",o:["*144#","*254#","*234#","*544#"],a:1,w:"Dial *254#; applicants are youth aged 18 to 29."}]];
Q2.forEach((q,i)=>D[i].quiz.push(...q));
const PAL=[["#F97316","#FFB347"],["#E8417A","#FF8FB1"],["#7C4DDB","#B197FC"],["#1E88E5","#64B5F6"],["#0E9F6E","#5FD3A1"],["#D99A00","#FFD25A"],["#D9480F","#FF8A5B"],["#0891B2","#5ED6D6"]];
const TABS=[["notes","Notes","<path d='M6 3h9l4 4v14H6z'/><path d='M14 3v5h5M9 13h7M9 17h7'/>"],["keys","Key Points","<path d='M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'/>"],["outs","Outcomes","<circle cx='12' cy='12' r='9'/><circle cx='12' cy='12' r='5'/><circle cx='12' cy='12' r='1.5'/>"],["quiz","Quiz","<circle cx='12' cy='12' r='9'/><path d='M9.5 9.5a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 4M12 17h.01'/>"],["teach","Teach","<path d='M3 4h18v12H3zM12 16v4M8 20h8'/>"]];
const ic=(p,s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const MOON="<path d='M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z'/>",SUN="<circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'/>";
const MASCOT=`<svg viewBox="0 0 100 110" width="84" height="92" aria-hidden="true"><path d="M50 6C58 28 86 40 86 70a36 36 0 01-72 0C14 52 28 44 34 28c6 10 10 12 16-22z" fill="#FFC93C"/><path d="M50 50c4 12 20 16 20 32a20 20 0 01-40 0c0-10 8-14 12-22 4 6 6 6 8-10z" fill="#FF8A1F"/><circle cx="41" cy="76" r="4" fill="#2A2140"/><circle cx="59" cy="76" r="4" fill="#2A2140"/><path d="M43 87q7 7 14 0" stroke="#2A2140" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
let S={chk:{},best:{},notes:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("ch")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ch",JSON.stringify(S))}catch(e){}};
let view="home",m=0,tab="notes",qz={i:0,s:0,p:null,done:false},kmode="list",fc={i:0,f:false},prt=false;
const $=s=>document.querySelector(s),app=$("#app"),hd=$("#hd"),M=$("#main"),nav=$("#nav");
const nm=i=>D[i].t.split(": ")[1],pr=i=>{const d=D[i];let n=0;d.keys.forEach((k,j)=>S.chk["k"+i+"_"+j]&&n++);d.outs.forEach((k,j)=>S.chk["o"+i+"_"+j]&&n++);return Math.round(n/(d.keys.length+d.outs.length)*100)};
function ring(p,col,s,t){const r=s/2-5,L=2*Math.PI*r,h=s/2;return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" style="stroke:${col}" stroke-opacity=".28" stroke-width="5"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" style="stroke:${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p/100)}" transform="rotate(-90 ${h} ${h})"/><text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${s/4}" font-weight="700" style="fill:${col}">${t}</text></svg>`}
const dark=()=>document.documentElement.dataset.theme==="dark";
const themeBtn=()=>`<button class="ib" data-a="theme" aria-label="Toggle dark mode">${ic(dark()?SUN:MOON,20)}</button>`;
function draw(anim){
  const home=view==="home",p=home?["#F97316","#E8417A"]:PAL[m];
  app.style.setProperty("--c",p[0]);app.style.setProperty("--c2",p[1]);
  if(home){
    const all=Math.round(D.reduce((a,_,i)=>a+pr(i),0)/D.length);
    hd.innerHTML=`<div class="top"><span class="lbl">The Creative Hustle</span>${themeBtn()}</div><div class="hero">${MASCOT}<div><h1>Learn. Build. Hustle.</h1><p>Entrepreneurship in ${D.length} modules</p><span class="pill" style="margin-top:8px">${all}% complete</span></div></div>`;
    M.innerHTML=`<div class="grid">${D.map((d,i)=>`<button class="mc" style="--a:${PAL[i][0]};--b:${PAL[i][1]}" data-m="${i}"><span class="big">${i+1}</span><div><small>Module ${i+1}</small><b>${nm(i)}</b></div><div class="ft"><span>${S.best[i]!=null?"Best quiz "+S.best[i]+"/"+d.quiz.length:"Not started"}</span>${ring(pr(i),"#fff",44,pr(i)+"%")}</div></button>`).join("")}</div><div class="foot">Tap a module to begin</div>`;
    nav.style.display="none";
  }else{
    const d=D[m];
    if(prt){hd.innerHTML=`<div class="top"><button class="ib" data-a="unprint" aria-label="Back to module">${ic("<path d='M15 5l-7 7 7 7'/>",22)}</button><span class="lbl">Print view</span><button class="ib" data-a="doprint" aria-label="Print">${ic(PRN,20)}</button></div><div class="mh"><h1>${nm(m)}</h1><span class="pill">Module ${m+1}</span></div>`;nav.style.display="none";M.innerHTML=sheet(d);M.className=anim?"in":"";if(anim)M.scrollTop=0;return}
    hd.innerHTML=`<div class="top"><button class="ib" data-a="home" aria-label="Back to all modules">${ic("<path d='M15 5l-7 7 7 7'/>",22)}</button><span class="lbl">Module ${m+1} of ${D.length}</span>${themeBtn()}</div><div class="mh"><h1>${nm(m)}</h1><span class="pill">${pr(m)}% complete</span></div>`;
    nav.style.display="flex";
    nav.innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?"act":""}"><i>${ic(t[2])}</i>${t[1]}</button>`).join("");
    M.innerHTML=body(d);
  }
  M.className=anim?"in":"";
  if(anim)M.scrollTop=0;
}
function body(d){
  if(tab==="notes")return `<div class="tools"><button class="tool" data-a="print">${ic(PRN,18)}<span>Print / save as PDF</span></button></div>`+d.notes.map((n,i)=>`<details class="note" ${i===0?"open":""}><summary><span class="num">${i+1}</span><span>${n[0]}</span><i class="chev">${ic("<path d='M9 5l7 7-7 7'/>",18)}</i></summary><div class="nb">${n[1]}</div></details>`).join("")+`<div class="card"><h3>My own notes</h3><textarea id="my" placeholder="Type your notes here…">${S.notes[m]||""}</textarea></div>`;
  if(tab==="keys")return keysView(d);
  if(tab==="outs"){const n=d.outs.filter((o,i)=>S.chk["o"+m+"_"+i]).length,pc=Math.round(n/d.outs.length*100);return `<div class="sum">${ring(pc,"var(--c)",64,pc+"%")}<div><b>By the end of this module I can…</b><span>${n} of ${d.outs.length} outcomes ticked</span></div></div>`+d.outs.map((o,i)=>{const id="o"+m+"_"+i,on=S.chk[id];return `<button class="row ${on?"on":""}" data-k="${id}"><span class="box">${on?"✓":""}</span><div><b>${o}</b></div></button>`}).join("")+(pc===100?`<div class="card"><h3>Module complete</h3><p>You have met every learning outcome. Well done.</p></div>`:"")}
  if(tab==="quiz")return quiz(d);
  const b=S.best[m];
  return `<div class="sum">${ring(pr(m),"var(--c)",64,pr(m)+"%")}<div><b>Class snapshot</b><span>Key points and outcomes ${pr(m)}% done. ${b!=null?"Best quiz: "+b+"/"+d.quiz.length:"Quiz not taken yet"}.</span></div></div><span class="chip">Session plan</span>`+d.teach.plan.map(p=>`<div class="tl"><i></i><div class="card"><h3>${p[1]} · ${p[0]}</h3><p>${p[2]}</p></div></div>`).join("")+`<span class="chip">Discussion questions</span>`+d.teach.ask.map(q=>`<div class="card"><p>${q}</p></div>`).join("");
}
const PRN="<path d='M6 9V3h12v6M6 18H4v-7h16v7h-2M6 14h12v7H6z'/>";
function sheet(d){return `<div class="sheet"><h2>Module ${m+1}: ${nm(m)}</h2><h3>Notes</h3>${d.notes.map((n,i)=>`<h4>${i+1}. ${n[0]}</h4><p>${n[1]}</p>`).join("")}<h3>Key points</h3><ul>${d.keys.map(k=>`<li><b>${k[0]}:</b> ${k[1]}</li>`).join("")}</ul><h3>Learning outcomes</h3><ul class="chk">${d.outs.map(o=>`<li>☐ ${o}</li>`).join("")}</ul><p class="tip noprint">Tap the print button at the top. If nothing opens, use your browser menu and choose Print, or Share, then Print or Save as PDF.</p></div>`}
function keysView(d){
  const seg=`<div class="seg"><button class="${kmode==="list"?"on":""}" data-a="km" data-v="list">Checklist</button><button class="${kmode==="cards"?"on":""}" data-a="km" data-v="cards">Flashcards</button></div>`;
  if(kmode==="list")return seg+`<span class="chip">Tap a point when you understand it</span>`+d.keys.map((k,i)=>{const id="k"+m+"_"+i,on=S.chk[id];return `<button class="row ${on?"on":""}" data-k="${id}"><span class="box">${on?"✓":""}</span><div><b>${k[0]}</b><span>${k[1]}</span></div></button>`}).join("");
  const k=d.keys[fc.i],on=S.chk["k"+m+"_"+fc.i],n=d.keys.length;
  return seg+`<div style="font-weight:600;font-size:.85rem">Card ${fc.i+1} of ${n}</div><div class="fc"><button class="fci ${fc.f?"f":""}" data-a="flip" aria-label="Flip card"><span class="face">${k[0]}</span><span class="face back">${k[1]}</span></button></div><div class="fcr"><button data-a="fprev">Back</button><button class="got" data-a="fgot">${on?"Got it ✓":"Got it"}</button><button data-a="fnext">Next</button></div><p class="foot">Tap the card to flip it</p>`}
function quiz(d){
  const Q=d.quiz;
  if(qz.done){const pc=Math.round(qz.s/Q.length*100),g=pc===100?"Champion! Perfect score.":pc>=50?"Good work! Keep going.":"Review the notes and try again.";
    return `<div class="score">${ring(pc,"var(--c)",130,qz.s+"/"+Q.length)}<p>${g}</p></div><button class="btn" data-a="retry">Try again</button>`}
  const q=Q[qz.i],a=qz.p!==null;
  return `<div style="font-weight:600;font-size:.85rem">Question ${qz.i+1} of ${Q.length}</div><div class="bar"><i style="width:${qz.i/Q.length*100}%"></i></div><div class="card"><h3>${q.q}</h3></div>`+q.o.map((o,i)=>`<button class="opt ${a?(i===q.a?"right":i===qz.p?"wrong":""):""}" data-o="${i}" ${a?"disabled":""}>${o}</button>`).join("")+(a?`<div class="why">${qz.p===q.a?"Correct! ":"Not quite. "}${q.w}</div><button class="btn" data-a="next">${qz.i+1<Q.length?"Next question":"See my score"}</button>`:"");
}
app.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.m!==undefined){m=+d.m;view="mod";tab="notes";prt=false;fc={i:0,f:false};qz={i:0,s:0,p:null,done:false};draw(1)}
  else if(d.a==="home"){view="home";prt=false;draw(1)}
  else if(d.a==="theme"){const r=document.documentElement;r.dataset.theme=dark()?"light":"dark";draw()}
  else if(d.a==="print"){prt=true;draw(1)}
  else if(d.a==="unprint"){prt=false;draw(1)}
  else if(d.a==="doprint"){try{window.print()}catch(err){}}
  else if(d.a==="km"){kmode=d.v;fc={i:0,f:false};draw()}
  else if(d.a==="flip"){fc.f=!fc.f;t.classList.toggle("f")}
  else if(d.a==="fprev"||d.a==="fnext"){const n=D[m].keys.length;fc.i=(fc.i+(d.a==="fnext"?1:n-1))%n;fc.f=false;draw()}
  else if(d.a==="fgot"){S.chk["k"+m+"_"+fc.i]=true;save();fc.f=false;if(fc.i<D[m].keys.length-1)fc.i++;draw()}
  else if(d.t){tab=d.t;draw(1)}
  else if(d.k){S.chk[d.k]=!S.chk[d.k];save();draw()}
  else if(d.o!==undefined){const q=D[m].quiz[qz.i];qz.p=+d.o;if(qz.p===q.a)qz.s++;draw()}
  else if(d.a==="next"){qz.p=null;qz.i++;if(qz.i>=D[m].quiz.length){qz.done=true;S.best[m]=Math.max(S.best[m]||0,qz.s);save()}draw()}
  else if(d.a==="retry"){qz={i:0,s:0,p:null,done:false};draw(1)}
});
app.addEventListener("input",e=>{if(e.target.id==="my"){S.notes[m]=e.target.value;save()}});
draw(1);
if("serviceWorker" in navigator){window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js")}catch(e){}})}
</script>
</body>
</html>
